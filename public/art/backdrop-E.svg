  <radialGradient id="sun" cx="0.8" cy="0.55" r="0.5"><stop offset="0" stop-color="#5e6577" stop-opacity=".55"/><stop offset="1" stop-color="#5e6577" stop-opacity="0"/></radialGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0d12" stop-opacity="0"/><stop offset="1" stop-color="#0b0d12" stop-opacity="1"/></linearGradient>
